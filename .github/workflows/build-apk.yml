name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Extract project source
        run: |
          unzip -q ai-cricket-streamer-android-v2-source.zip -d extracted
          PROJECT_DIR=$(dirname "$(find extracted -name settings.gradle.kts -print -quit)")
          if [ -z "$PROJECT_DIR" ]; then echo "Android project not found"; exit 1; fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Install bilingual interface and RTMP scoreboard engine
        run: |
          ASSET_DIR="$PROJECT_DIR/app/src/main/assets"
          JAVA_DIR="$PROJECT_DIR/app/src/main/java/com/aicricketstreamer/mobile"
          mkdir -p "$ASSET_DIR" "$JAVA_DIR"
          cp app-overlay/index.html "$ASSET_DIR/index.html"
          cp app-overlay/app.js "$ASSET_DIR/app.js"
          cat app-overlay/style.css >> "$ASSET_DIR/style.css"
          cp app-overlay/java/com/aicricketstreamer/mobile/MainActivity.kt "$JAVA_DIR/MainActivity.kt"
          cp app-overlay/java/com/aicricketstreamer/mobile/ScoreboardActivity.kt "$JAVA_DIR/ScoreboardActivity.kt"
          cp app-overlay/java/com/aicricketstreamer/mobile/ScoreboardBitmapSource.kt "$JAVA_DIR/ScoreboardBitmapSource.kt"
          sed -i 's#repositories { google(); mavenCentral() }#repositories { google(); mavenCentral(); maven { url = uri("https://jitpack.io") } }#' "$PROJECT_DIR/settings.gradle.kts"
          cat >> "$PROJECT_DIR/app/build.gradle.kts" <<'EOF'

          dependencies {
              implementation("com.github.pedroSG94.RootEncoder:library:2.8.1")
          }
          EOF
          sed -i 's#</application>#        <activity android:name=".ScoreboardActivity" android:exported="false" />\n    </application>#' "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Fix Java Kotlin compatibility
        run: |
          cat >> "$PROJECT_DIR/app/build.gradle.kts" <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          EOF

      - name: Package extracted source for inspection
        run: |
          cd "$GITHUB_WORKSPACE"
          zip -qr /tmp/android-source-inspection.zip extracted

      - name: Upload source inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-source-inspection
          path: /tmp/android-source-inspection.zip

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-cricket-streamer-apk
          path: extracted/**/app/build/outputs/apk/debug/*.apk
