name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          unzip -q ai-cricket-streamer-android-v2-source.zip -d extracted
          PROJECT_DIR=$(dirname "$(find extracted -name settings.gradle.kts -print -quit)")
          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Apply bilingual Urdu and English interface
        run: |
          mkdir -p "$PROJECT_DIR/app/src/main/assets"
          cp app-overlay/index.html "$PROJECT_DIR/app/src/main/assets/index.html"
          cp app-overlay/app.js "$PROJECT_DIR/app/src/main/assets/app.js"
          cat app-overlay/style.css >> "$PROJECT_DIR/app/src/main/assets/style.css"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Fix Java Kotlin compatibility
        run: |
          cat >> "$PROJECT_DIR/app/build.gradle.kts" <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          EOF

      - name: Package extracted source for inspection
        run: |
          cd "$GITHUB_WORKSPACE"
          zip -qr /tmp/android-source-inspection.zip extracted

      - name: Upload source inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-source-inspection
          path: /tmp/android-source-inspection.zip

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-cricket-streamer-apk
          path: extracted/**/app/build/outputs/apk/debug/*.apk
